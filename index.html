<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Morocco Weather</title>

    <link rel="stylesheet" href="src/style.css" />
  </head>

  <body>
    <div class="app-shell">
      <header class="site-header">
        <div class="brand-wrap">
          <span class="brand-mark">☀️</span>
          <h1>Weather Hub</h1>
        </div>
      </header>

      <main class="page-shell">
        <section class="search-section">
          <div class="search-panel">
            <div class="search-header">
              <p class="eyebrow">Live forecast</p>
              <h2>Search for a Moroccan city</h2>
            </div>

            <div class="search-controls">
              <input
                type="search"
                id="search"
                name="search"
                placeholder="Enter a city, e.g. Nador"
              />

              <button type="button" id="search-button">Search</button>
            </div>

            <p id="loading" class="hidden mt-4">Loading...</p>
            <p id="error-msg" class="hidden mt-4 text-red-600"></p>
          </div>

          <div id="weather-container" class="weather-grid" aria-live="polite"></div>
        </section>

        <section class="forecast-section">
          <div class="section-title-row">
            <h2>5-Day Forecast</h2>
          </div>

          <div id="forecast-container" class="forecast-grid" aria-live="polite"></div>
        </section>
      </main>
    </div>

    <script src="src/main.js" type="module"></script>
  </body>
</html>
